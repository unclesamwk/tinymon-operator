image:
  repository: unclesamwk/tinymon-operator
  tag: ""
  pullPolicy: IfNotPresent

tinymon:
  url: ""
  apiKey: ""
  clusterName: ""

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""

nodeMonitor:
  enabled: false
  image:
    repository: unclesamwk/tinymon-node-monitor
    tag: ""
  interval: 60
  # Comma-separated mount paths to include (empty = all)
  diskIncludeMounts: ""
  # Comma-separated mount prefixes to exclude (empty = none)
  diskExcludeMounts: ""
  # Flap suppression: require this many consecutive samples at a new status
  # before reporting the change (1 = report every sample, no debounce).
  # Raise to 3 to ride out transient spikes (e.g. a backup job briefly
  # pushing memory over the line) without flapping the check.
  flapSamples: 1
  # Alert thresholds in percent (warning at *WarnPct, critical at *CritPct).
  thresholds:
    memWarnPct: 80
    memCritPct: 90
    diskWarnPct: 80
    diskCritPct: 90
    loadWarnPct: 80
    loadCritPct: 90
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
