image:
  repository: unclesamwk/tinymon-operator
  tag: ""
  pullPolicy: IfNotPresent

tinymon:
  url: ""
  apiKey: ""
  clusterName: ""

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""

nodeMonitor:
  enabled: false
  image:
    repository: unclesamwk/tinymon-node-monitor
    tag: ""
  interval: 60
  # Comma-separated mount paths to include (empty = all)
  diskIncludeMounts: ""
  # Comma-separated mount prefixes to exclude (empty = none)
  diskExcludeMounts: ""
  # Flap suppression: require this many consecutive samples at a new status
  # before reporting the change (1 = report every sample, no debounce).
  # Raise to 3 to ride out transient spikes (e.g. a backup job briefly
  # pushing memory over the line) without flapping the check.
  flapSamples: 1
  # Alert thresholds in percent (warning at *WarnPct, critical at *CritPct).
  #
  # load*Pct is load per core, taken from the **5-minute** average: 100 means
  # every core busy with nothing queued, 200 means twice as many runnable
  # processes as cores. The 1-minute average is still reported in the message but
  # no longer decides the status — it tracks every backup and deploy, which is
  # work happening, not a fault. A host that idles above the default (a Pi at 80%
  # RAM, a 4-core box with a base load of 2.7) needs these raised per cluster,
  # otherwise the check alerts on the normal state.
  thresholds:
    memWarnPct: 80
    memCritPct: 90
    diskWarnPct: 80
    diskCritPct: 90
    loadWarnPct: 80
    loadCritPct: 90
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
